<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop Apple MacBook Air 13’’</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header">
      <div class="container">
        <div class="logo">
          <img src="../poze/temulogo.png" width="200px" alt="Temu Logo">
        </div>
        <nav>
          <ul id="MenuItems">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../cos.html"><img src="../poze/cart-icon.png" width="30px" height="30px" alt="Coș"></a></li>
            <li><a href="../login.html">Account</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- CONTINUT PRINCIPAL -->
  <main>
    <aside>
      <img src="../poze/laptop1.png" alt="Laptop Apple MacBook Air 13''" width="300">
      <div>
        <img src="../poze/laptop1.png" alt="thumb1" width="60">
        <img src="../poze/laptop2.avif" alt="thumb2" width="60">
        <img src="../poze/laptop3.jpg" alt="thumb3" width="60">
      </div>
    </aside>

    <section>
      <div class="col-4" 
           data-price="6499" 
           data-name="Laptop Apple MacBook Air 13''" 
           data-img="../poze/laptop1.png">
        <h2>Laptop Apple MacBook Air 13’’ (M2, 8GB RAM, 256GB SSD, Silver)</h2>
        <p>⭐ <strong>4.9</strong> (122 de review-uri)</p>
        <p class="price">6.499<sup>99</sup> Lei</p>

        <button class="buy-now">Adaugă în coș</button>

        <div class="buyback">
          <strong>Easy BuyBack:</strong> Primești 300 Lei BONUS la schimb cu un laptop vechi.
        </div>
      </div>

      <p style="margin-top: 20px;">Livrare lentă disponibilă în toată țara.</p>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <hr>
    <p>&copy; 2025 TEMU2. Niciun drept rezervat.</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    // Funcții identice ca în cos.html (compatibile)
    function getLoggedUser() {
      return localStorage.getItem("loggedInUser");
    }

    function getCartKey() {
      const user = getLoggedUser();
      return user ? `cart_${user}` : "cart_guest";
    }

    function getCart() {
      const key = getCartKey();
      return JSON.parse(localStorage.getItem(key)) || [];
    }

    function saveCart(cart) {
      const key = getCartKey();
      localStorage.setItem(key, JSON.stringify(cart));
    }

    function addToCart(product) {
      let cart = getCart();

      // Comparăm produse după nume și preț (fără diferențe de spații)
      const existing = cart.find(item => 
        item.name.trim().toLowerCase() === product.name.trim().toLowerCase() &&
        item.price === product.price
      );

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      saveCart(cart);
      alert(`${product.name} a fost adăugat în coș!`);
    }

    // Butonul de adăugare
    document.querySelectorAll(".buy-now").forEach(button => {
      button.addEventListener("click", e => {
        const parent = e.target.closest(".col-4");
        const product = {
          name: parent.dataset.name.replace(/\s+/g, ' ').trim(), // elimină spațiile duble
          price: parseFloat(parent.dataset.price),
          img: parent.dataset.img // cheia compatibilă cu cos.html
        };
        addToCart(product);
      });
    });
  </script>

</body>
</html>
