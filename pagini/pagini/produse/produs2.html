<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspirator Vertical 4 in 1</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <header>
    <div class="header">
      <div class="container">
        <div class="logo">
          <img src="../poze/temulogo.png" width="200px" alt="Temu Logo">
        </div>
        <nav>
          <ul id="MenuItems">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../cos.html"><img src="../poze/cart-icon.png" width="30px" height="30px" alt="Coș"></a></li>
            <li><a href="../login.html">Account</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <img src="../poze/aspirator1.png" alt="Aspirator Vertical 4 in 1" width="300">
      <div>
        <img src="../poze/aspirator1.png" alt="thumb1" width="60">
        <img src="../poze/aspirator2.png" alt="thumb2" width="60">
        <img src="../poze/aspirator3.png" alt="thumb3" width="60">
      </div>
    </aside>

    <section>
      <div class="col-4" data-price="699" data-name="Aspirator Vertical 4 in 1" data-image="../poze/aspirator1.png">
        <h2>Aspirator Vertical 4 in 1, putere mare de aspirare</h2>
        <p>⭐ <strong>4.8</strong> (88 de review-uri)</p>
        <p class="price">699 Lei</p>

        <button class="buy-now">Adaugă în coș</button>

        <div class="buyback">
          <strong>Easy BuyBack:</strong> Primești 50 Lei BONUS la schimb cu un aspirator vechi.
        </div>
      </div>
      <p style="margin-top: 20px;">Livrare gratuită în toată țara.</p>
    </section>
  </main>

  <footer>
    <hr>
    <p>&copy; 2025 TEMU2. Niciun drept rezervat.</p>
  </footer>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }
    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
    }
    function addToCart(product) {
      let cart = getCart();
      const existing = cart.find(item => item.name === product.name);
      if (existing) existing.quantity += 1;
      else cart.push({ ...product, quantity: 1 });
      saveCart(cart);
      alert(`${product.name} a fost adăugat în coș!`);
    }
    document.querySelector(".buy-now").addEventListener("click", e => {
      const parent = e.target.closest(".col-4");
      const product = {
        name: parent.dataset.name,
        price: parseFloat(parent.dataset.price),
        img: parent.dataset.image
      };
      addToCart(product);
    });
  </script>
</body>
</html>
